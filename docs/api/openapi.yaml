          "$ref": "#/components/schemas/ActiveVersions"
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/VersionSummary"
        next_cursor:
          "$ref": "#/components/schemas/NextCursor"
    ReviewVersionRequest:
      type: "object"
      additionalProperties: false
      required:
        - "decision"
        - "report_id"
        - "reason"
      properties:
        decision:
          "$ref": "#/components/schemas/ReviewDecision"
        report_id:
          "$ref": "#/components/schemas/Id"
        reason:
          type: "string"
          description: "去掉首尾空白后仍需有内容"
          minLength: 1
          maxLength: 2000
    ReleaseRequest:
      type: "object"
      additionalProperties: false
      required:
        - "expected_release_id"
      properties:
        expected_release_id:
          "$ref": "#/components/schemas/Id"
    RollbackRequest:
      type: "object"
      additionalProperties: false
      required:
        - "expected_release_id"
        - "reason"
      properties:
        expected_release_id:
          "$ref": "#/components/schemas/Id"
        reason:
          type: "string"
          description: "去掉首尾空白后仍需有内容"
          minLength: 1
          maxLength: 2000
    ReleaseEvent:
      type: "object"
      additionalProperties: false
      required:
        - "operation"
        - "active"
        - "previous_release_id"
        - "actor_id"
        - "created_at"
      properties:
        operation:
          type: "string"
          enum:
            - "release"
            - "rollback"
        active:
          "$ref": "#/components/schemas/ActiveVersions"
        previous_release_id:
          "$ref": "#/components/schemas/Id"
        actor_id:
          "$ref": "#/components/schemas/Id"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    CreatePreferenceRequest:
      type: "object"
      additionalProperties: false
      required:
        - "text"
      properties:
        text:
          type: "string"
          description: "显式保存的业务偏好，去掉首尾空白后仍需有内容"
          minLength: 1
          maxLength: 500
    Preference:
      type: "object"
      additionalProperties: false
      required:
        - "preference_id"
        - "text"
        - "index_status"
        - "created_at"
      properties:
        preference_id:
          "$ref": "#/components/schemas/Id"
        text:
          type: "string"
          maxLength: 500
        index_status:
          type: "string"
          enum:
            - "pending"
            - "ready"
            - "failed"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    PreferencePage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Preference"
        next_cursor:
          "$ref": "#/components/schemas/NextCursor"
    EvaluationGroup:
      type: "object"
      additionalProperties: false
      required:
        - "name"
        - "sample_count"
        - "metrics"
      properties:
        name:
          type: "string"
        sample_count:
          type: "integer"
          minimum: 1
        metrics:
          type: "object"
          additionalProperties:
            type:
              - "number"
              - "null"
    EvaluationCaseResult:
      type: "object"
      additionalProperties: false
      required:
        - "group"
        - "actual"
        - "correct"
      properties:
        group:
          type: "string"
          description: "与同一报告 groups 中的 name 一致"
        actual:
          type: "string"
          minLength: 1
          description: "合成案例的实际判断或失败摘要"
        correct:
          type: "boolean"
    EvaluationCaseExample:
      type: "object"
      additionalProperties: false
      required:
        - "case_id"
        - "scenario"
        - "expected"
        - "results"
      properties:
        case_id:
          "$ref": "#/components/schemas/Id"
        scenario:
          type: "string"
          minLength: 1
        expected:
          type: "string"
          minLength: 1
        results:
          type: "array"
          minItems: 1
          items:
            "$ref": "#/components/schemas/EvaluationCaseResult"
    Evaluation:
      type: "object"
      additionalProperties: false
      required:
        - "evaluation_id"
        - "kind"
        - "mode"
        - "model_id"
        - "data_version"
        - "data_hash"
        - "code_ref"
        - "config_hash"
        - "baseline_group"
        - "groups"
        - "case_examples"
        - "artifact_path"
        - "created_at"
      properties:
        evaluation_id:
          "$ref": "#/components/schemas/Id"
        kind:
          type: "string"
          enum:
            - "logistics"
            - "rag"
            - "grounding"
        mode:
          "$ref": "#/components/schemas/ModelMode"
        model_id:
          anyOf:
            - type: "string"
            - type: "null"
        data_version:
          "$ref": "#/components/schemas/Id"
        data_hash:
          "$ref": "#/components/schemas/Sha256"
        code_ref:
          type: "string"
        config_hash:
          "$ref": "#/components/schemas/Sha256"
        baseline_group:
          type: "string"
          description: "用于显示主对照的组名，须在 groups 中存在"
        groups:
          type: "array"
          items:
            "$ref": "#/components/schemas/EvaluationGroup"
          minItems: 1
        case_examples:
          type: "array"
          description: "报告中允许公开展开的合成案例摘要"
          maxItems: 5
          items:
            "$ref": "#/components/schemas/EvaluationCaseExample"
        artifact_path:
          type: "string"
          description: "公开归档中的项目相对路径，不含本机路径"
        created_at:
          "$ref": "#/components/schemas/Timestamp"
    EvaluationPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Evaluation"
        next_cursor:
          "$ref": "#/components/schemas/NextCursor"
