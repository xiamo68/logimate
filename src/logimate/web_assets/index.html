<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132031">
  <title>LogiMate · 供应链排查工作台</title>
  <link rel="stylesheet" href="/assets/workbench.css?v=agent-process">
  <script type="module" src="/assets/workbench.js?v=agent-process"></script>
</head>
<body>
  <a class="skip" href="#main">跳到工作区</a>
  <aside class="rail">
    <a class="brand" href="#investigate"><span class="brand-mark" aria-hidden="true"></span>LogiMate</a>
    <nav class="tabs" aria-label="工作台导航">
      <a href="#investigate" data-view="investigate">订单排查</a>
      <a href="#improve" data-view="improve">策略改进</a>
      <a href="#evaluate" data-view="evaluate">评测归档</a>
    </nav>
    <form class="identity" id="identity-form">
      <p id="connection" role="status"><span class="dot"></span>正在连接</p>
      <label for="profile">身份</label>
      <select id="profile" name="profile">
        <option value="alpha_operator">Alpha · 运营</option>
        <option value="alpha_reviewer">Alpha · 审核</option>
        <option value="beta_operator">Beta · 运营</option>
        <option value="beta_reviewer">Beta · 审核</option>
      </select>
      <button id="switch-profile" class="rail-button" type="submit">切换身份</button>
    </form>
  </aside>
  <div class="workspace">
    <main id="main" tabindex="-1">
      <p id="notice" class="notice" role="status" hidden></p>
      <section id="investigate" aria-labelledby="investigate-heading">
        <div class="page-heading"><div><h1 id="investigate-heading">订单异常排查</h1>
          <p>定位履约卡点，核对业务记录并确定下一步处理动作。</p></div>
          <span class="data-scope">本地 · 合成数据</span></div>
        <form class="panel question" id="investigate-form">
          <div class="lookup-row">
            <label for="order-number">订单号<input id="order-number" name="order" placeholder="输入订单号" maxlength="64"></label>
            <button class="primary" id="ask" type="submit">查询订单</button>
            <button class="quiet" id="sample-order" type="button">填入样例 LM-1001</button>
            <button class="quiet" id="new-session" type="button">新排查会话</button>
          </div>
          <details class="follow-up" id="follow-up">
            <summary>补充问题或追问</summary>
            <label class="form-label" for="question">问题
              <textarea id="question" name="question" rows="2" maxlength="2000" placeholder="例如：这个订单已发货，为什么还没揽收？"></textarea>
            </label>
            <button class="primary" id="ask-follow-up" type="submit">发送问题</button>
          </details>
        </form>
        <div class="report-grid">
          <section class="panel order-panel" aria-label="订单排查结果">
            <div id="result" aria-live="polite"><h2>订单排查结果</h2><p class="empty">输入订单号后查看核查结论和业务证据。</p></div>
            <div id="feedback-form-slot"></div>
          </section>
          <aside class="panel action-panel" id="handling-panel" aria-labelledby="action-heading" tabindex="-1"><h2 id="action-heading">处理建议</h2>
            <div id="next-action"><p class="empty">查询后将根据已取得的证据给出处理建议。</p></div>
          </aside>
        </div>
        <details class="panel technical" id="technical"><summary>技术详情</summary><div id="trace"></div></details>
        <section class="panel" id="history-panel" hidden><h2>会话记录</h2><div id="history"></div></section>
      </section>
      <section id="improve" aria-labelledby="improve-heading" hidden>
        <div class="page-heading"><h1 id="improve-heading">策略改进</h1>
          <p>复核运营纠正，查看候选版本回放，并管理已验证的规则与技能。</p></div>
        <div class="improve-grid">
          <section class="panel"><div class="section-head"><h2>反馈与任务</h2><button id="reload-improve" class="quiet" type="button">刷新</button></div>
            <div id="feedback-list"></div><div id="job-status" aria-live="polite"></div>
          </section>
          <section class="panel"><div class="section-head"><h2>版本与回放</h2></div><div id="versions"></div></section>
        </div>
      </section>
      <section id="evaluate" aria-labelledby="evaluate-heading" hidden>
        <div class="page-heading"><h1 id="evaluate-heading">评测归档</h1><p>查看已归档的模型模式、样本和对照结果。</p></div>
        <section class="panel">
          <form id="evaluation-filters" class="filter-row">
            <label>实验<select id="evaluation-kind"><option value="">全部</option><option value="logistics">物流诊断</option><option value="rag">售后检索</option><option value="grounding">事实校验</option></select></label>
            <label>模型模式<select id="evaluation-mode"><option value="">全部</option><option value="demo">无密钥</option><option value="deepseek">DeepSeek</option></select></label>
            <button type="submit" class="quiet">刷新归档</button>
          </form>
          <div id="evaluations" aria-live="polite"></div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
